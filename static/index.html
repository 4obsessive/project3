<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1310">
<meta name="description" content="Deadlock Scouting: find, compare and analyze Deadlock players, teams and matches.">
<title>Deadlock Scouting</title>
<link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside class="rail" aria-label="Navigation">
  <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true"></span><span>Deadlock <b>Scouting</b></span></a>
  <nav id="nav" aria-label="Sections">
    <span class="nav-group" role="presentation">Scouting</span>
    <a href="#home" data-view="home">Home</a>
    <a href="#players" data-view="players">Players</a>
    <a href="#hero" data-view="hero">By hero</a>
    <a href="#climbers" data-view="climbers">Climbers</a>
    <span class="nav-group" role="presentation">Teams</span>
    <a href="#teams" data-view="teams">Teams</a>
    <a href="#report" data-view="report">Report</a>
    <span class="nav-group" role="presentation">Analysis</span>
    <a href="#matches" data-view="matches">Matches</a>
    <span class="nav-group" role="presentation">System</span>
    <a href="#settings" data-view="settings">Settings</a>
  </nav>
  <div class="rail-foot"><div id="status" class="status" aria-label="Update status"></div></div>
</aside>
<div class="app">
  <header class="topbar">
    <div class="crumb" id="crumb"></div>
    <span class="chip win" id="window-chip" hidden></span>
    <div class="gsearch" id="gsearch"></div>
    <div id="status-mobile" class="status-mobile" aria-label="Update status"></div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Player profile" hidden></aside>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<noscript>Deadlock Scouting needs JavaScript to run.</noscript>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
